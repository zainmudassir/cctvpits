<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6bd6">
<title>Product | CCTV PITS</title>
<meta name="description" content="CCTV product details at CCTV PITS.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="canonical" href="https://cctvpits.store/product.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CCTV PITS">
<meta property="og:title" content="Product | CCTV PITS">
<meta property="og:description" content="CCTV product details at CCTV PITS.">
<meta property="og:url" content="https://cctvpits.store/product.html">
<meta property="og:image" content="https://cctvpits.store/logo.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="pg" data-page="shop">
<div id="site-head"></div>

<section class="pg-sec"><div id="out"><p class="empty">Loading product...</p></div></section>
<section class="pg-sec alt" id="relrow" hidden><h2>More from this company</h2><div class="scroller" id="rel"></div></section>

<div id="site-foot"></div>
<script type="module" src="site.js"></script>
<script type="module">
import { cachedCatalog, loadCatalog, brandOf, typeOf, productCard, bindCart, rs, esc, q } from "./store.js";
import { addToCart } from "./cart.js";
const $ = id => document.getElementById(id), id = q.get("id") || "", enc = encodeURIComponent;
const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5"><path d="M3 6l13 4-2 6L3 12zM16 10l5-1v6l-5-1M8 16l-2 4h5"/></svg>';
let all = [];
function draw(cat, final) {
  all = cat.products;
  const p = all.find(x => x.id === id);
  if (!p) { if (final) $("out").innerHTML = '<p class="empty">We could not find this product. <a href="shop.html" style="color:var(--blue);font-weight:700">Back to shop</a></p>'; return; }
  const sale = Number(p.comparePrice) > Number(p.price), out = p.stock === 0, b = brandOf(p), t = typeOf(p);
  document.title = p.name + " | CCTV PITS";
  const md = document.querySelector('meta[name="description"]'); if (md) md.content = (p.description || p.name + " from " + b + " at CCTV PITS").slice(0, 155);
  $("out").innerHTML = `<div class="crumb"><a href="shop.html">Shop</a> &rsaquo; <a href="shop.html?brand=${enc(b)}">${esc(b)}</a> &rsaquo; <a href="shop.html?brand=${enc(b)}&type=${enc(t)}">${esc(t)}</a></div>
  <div class="pd"><div class="pic">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.outerHTML='${icon.replace(/'/g, "&#39;")}'">` : icon}</div>
  <div><div class="meta"><a href="shop.html?brand=${enc(b)}">${esc(b)}</a> &middot; ${esc(t)}</div><h1>${esc(p.name)}</h1>
  <div class="price">${sale ? `<s>${rs(p.comparePrice)}</s>` : ""}${rs(p.price)}</div>
  ${p.description ? `<p style="color:#333;margin-bottom:6px">${esc(p.description)}</p>` : ""}
  <p class="meta">${out ? "Out of stock" : "In stock. Genuine product with warranty."}</p>
  <div class="acts">${out ? '<button class="btn" disabled>Out of stock</button>' : '<button class="btn" id="add">Add to cart</button>'}<a class="btn ghost" href="install.html?product=${enc(p.id)}">Add installation</a></div></div></div>`;
  const a = $("add"); if (a) a.onclick = () => { addToCart(p); a.textContent = "Added \u2713"; setTimeout(() => a.textContent = "Add to cart", 1200); };
  const rel = all.filter(x => x.id !== p.id && brandOf(x) === b).slice(0, 8);
  $("relrow").hidden = !rel.length; $("rel").innerHTML = rel.map(productCard).join("");
}
bindCart($("rel"), () => all);
draw(cachedCatalog(), false); loadCatalog().then(c => draw(c, true));
</script>
</body>
</html>
