<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6bd6">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="robots" content="noindex, nofollow">
<title>My account | CCTV PITS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.png" alt="" onerror="this.style.display='none'">CCTV PITS</a>
  <nav><a href="index.html">Store</a><a href="cart.html">Cart</a><a href="#" id="out">Log out</a></nav>
</header>
<main class="wrap">
  <h1 id="hello">My account</h1>
  <p class="sub">Your details and settings.</p>
  <div class="box"><h2>Account</h2>
    <div class="kv"><b>Name</b><span id="v-name"></span><b>Email</b><span id="v-email"></span><b>Phone</b><span id="v-phone"></span><b>Member since</b><span id="v-since"></span></div>
  </div>
  <div class="box"><h2>Update details</h2>
    <form id="f" class="wide">
      <div class="row"><div><label for="name">Full name</label><input id="name" name="name" required></div>
      <div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required></div></div>
      <button class="primary" type="submit" style="max-width:220px">Save changes</button>
      <div id="msg" class="msg" role="alert"></div>
    </form>
  </div>
  <div class="box" id="orders"><h2>My orders</h2><div id="olist">Loading...</div></div>
  <div class="box" id="installs"><h2>My installation requests</h2><div id="ilist">Loading...</div><p style="margin-top:12px"><a href="install.html" style="color:var(--blue);font-weight:700">Book an installation</a></p></div>
</main>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const $ = id => document.getElementById(id);
const show = (t, c) => { $("msg").textContent = t; $("msg").className = "msg " + c; };
$("out").onclick = e => { e.preventDefault(); signOut(auth); };
import { rs, esc } from "./cart.js";
async function loadOrders(uid) {
  try {
    const snap = await getDocs(query(collection(db, "orders"), where("userId", "==", uid)));
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("olist").innerHTML = list.map(o => `<div class="order">
      <div class="oh"><b>#${o.id.slice(0, 6).toUpperCase()}</b><span class="pill ${esc(o.status)}">${esc(o.status)}</span>${o.installation ? '<span class="pill new">Installation requested</span>' : ""}<span>${o.createdAt ? o.createdAt.toDate().toLocaleDateString() : ""}</span></div>
      <div>${(o.items || []).map(i => esc(i.name) + " x " + i.qty).join(", ")}</div>
      <div><b>${rs(o.total)}</b> &middot; Paid to ${esc(o.payment?.bankName)} &middot; Trx ID: ${esc(o.trxId)}</div>
    </div>`).join("") || "<p>No orders yet.</p>";
  } catch (e) { $("olist").textContent = "Could not load orders."; }
}
async function loadInstalls(uid) {
  try {
    const snap = await getDocs(query(collection(db, "installRequests"), where("userId", "==", uid)));
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("ilist").innerHTML = list.map(r => `<div class="order">
      <div class="oh"><b>#${r.id.slice(0, 6).toUpperCase()}</b><span class="pill ${esc(r.status)}">${esc(r.status)}</span><span>${r.createdAt ? r.createdAt.toDate().toLocaleDateString() : ""}</span></div>
      <div>${esc(r.placeType)} &middot; ${esc(r.cameras)} item${r.cameras > 1 ? "s" : ""} &middot; ${esc(r.address)}, ${esc(r.city)}</div>
      ${(r.items || []).map(i => `<div>&bull; ${esc(i.quantity)} x ${esc(i.name)}</div>`).join("")}
    </div>`).join("") || "<p>No installation requests yet.</p>";
  } catch (e) { $("ilist").textContent = "Could not load requests."; }
}
let user;
onAuthStateChanged(auth, async u => {
  if (!u) return location.replace("login.html");
  user = u;
  let d = {};
  try { d = (await getDoc(doc(db, "users", u.uid))).data() || {}; } catch (e) {}
  const name = d.name || u.displayName || "";
  $("hello").textContent = "Hi, " + (name.split(" ")[0] || "there");
  $("v-name").textContent = name || "-";
  $("v-email").textContent = u.email;
  $("v-phone").textContent = d.phone || "-";
  $("v-since").textContent = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : "-";
  $("name").value = name; $("phone").value = d.phone || "";
  loadOrders(u.uid); loadInstalls(u.uid);
});
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim(), phone = $("phone").value.trim();
  try {
    await updateDoc(doc(db, "users", user.uid), { name, phone });
    await updateProfile(user, { displayName: name });
    $("v-name").textContent = name; $("v-phone").textContent = phone;
    show("Details saved.", "ok");
  } catch (err) { show("Could not save. Try again.", "err"); }
});
</script>
</body>
</html>
