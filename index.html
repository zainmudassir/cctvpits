<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1424">
<title>CCTV PITS | Buy CCTV Cameras, DVRs and Accessories</title>
<meta name="description" content="Shop CCTV cameras, DVRs, NVRs and accessories from top brands. Add to cart, pay by bank transfer and we confirm your order.">
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1424;--card:#0b1a30;--card2:#101f38;--line:rgba(255,255,255,.12);--ink:#fff;--mute:#c9d1dc;--dim:#8b97a8;--accent:#ed1d24;--accent2:#c8141a;--ok:#4ade80;--bad:#ff8a8a;--head:'Orbitron','Public Sans',sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:150px}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid rgba(237,29,36,.6);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hd{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:3px solid var(--accent)}
.hd-in{max-width:1320px;margin:0 auto;padding:12px 4vw;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:36px;width:auto;display:block}
.search{position:relative;max-width:620px;width:100%;justify-self:center}
.search input{width:100%;height:46px;background:var(--card);border:1px solid var(--line);padding:0 14px 0 44px;border-radius:4px}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:0;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.acts{display:flex;align-items:center;gap:10px}
.acct{font:700 12px/1 var(--head);letter-spacing:.5px;text-transform:uppercase;text-decoration:none;border:2px solid #fff;border-radius:3px;padding:11px 14px;white-space:nowrap}
.acct:hover{background:#fff;color:var(--bg)}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;background:var(--accent);border:0;border-radius:3px;height:42px;padding:0 16px;cursor:pointer;font:700 12px/1 var(--head);letter-spacing:.5px;text-transform:uppercase}
.cartbtn:hover{background:var(--accent2)}
.cartbtn b{min-width:20px;height:20px;border-radius:10px;background:#fff;color:var(--accent);font:700 12px/20px 'Public Sans',sans-serif;text-align:center;padding:0 5px}
.cartbtn b.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}

/* toolbar */
.bar{max-width:1320px;margin:0 auto;width:100%;padding:22px 4vw 0;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:#fff}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar select{height:44px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 12px;min-width:150px}
.bar select option{background:var(--card);color:#fff}
.count{max-width:1320px;margin:0 auto;width:100%;padding:14px 4vw 0;color:var(--dim);font-size:14px}

/* grid */
main{flex:1;max-width:1320px;margin:0 auto;width:100%;padding:0 4vw 60px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--accent);transform:translateY(-4px)}
.media{position:relative}
.prd-img{position:relative;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#c9d1dc}
.prd-img img{display:block;width:100%;height:100%;object-fit:contain;padding:10px;opacity:0;transition:opacity .35s}
.badge{position:absolute;top:10px;font:700 12px/1 'Public Sans',sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:6px 9px;color:#fff;z-index:2}
.b-new{left:10px;background:var(--accent)}.b-off{right:10px;background:var(--bg)}
.body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.brand{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.name{font-size:17px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.desc{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.price{font-family:var(--head);font-size:18px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.price s{color:var(--dim);font:400 13px 'Public Sans',sans-serif;margin-left:6px}
.stock{font-size:13px}.stock.in{color:var(--ok)}.stock.low{color:#f2b827}.stock.out{color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:13px 14px;font:700 13px/1 var(--head);letter-spacing:.5px;text-transform:uppercase;text-decoration:none;cursor:pointer;border-radius:3px;transition:.2s}
.btn:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2)}
.btn:disabled{background:transparent;border-color:var(--line);color:var(--dim);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:#fff}.btn.ghost:hover{border-color:var(--accent);background:transparent}
.btn.sec{background:transparent;border-color:var(--line)}.btn.sec:hover:not(:disabled){background:transparent;border-color:#fff}
.msg{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.sk{height:360px;background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%);background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;margin-top:34px}.more[hidden]{display:none}
.more button{background:transparent;border:1px solid var(--accent);padding:14px 34px;font-weight:600;cursor:pointer}.more button:hover{background:var(--accent)}

/* footer */
.ft{border-top:1px solid var(--line);padding:22px 4vw;text-align:center;color:var(--dim);font-size:14px}
.ft a{color:var(--mute)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#fff;color:var(--bg);padding:12px 18px;border-radius:4px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* side panel (cart, checkout) */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.25s;z-index:60}
#ov.on{opacity:1;visibility:visible}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);border-left:3px solid var(--accent);z-index:70;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s,visibility 0s .28s}
#panel.on{transform:none;visibility:visible;transition:transform .28s}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.ph h2{font:700 16px/1.2 var(--head);letter-spacing:.5px}
.x{background:transparent;border:1px solid var(--line);width:38px;height:38px;border-radius:3px;cursor:pointer;font-size:22px;line-height:1}.x:hover{border-color:#fff}
#pbody{flex:1;overflow-y:auto;padding:18px 20px 24px}
.pf{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.pf[hidden]{display:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tot b{font-family:var(--head);font-size:20px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.line .n{font-weight:700;line-height:1.3}.line .u{color:var(--dim);font-size:13px}.line .t{font-weight:700;text-align:right;white-space:nowrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px;margin-top:6px}
.qty button{width:34px;height:34px;background:transparent;border:0;cursor:pointer;font-size:18px}.qty button:hover:not(:disabled){background:var(--card2)}.qty button:disabled{color:var(--dim);cursor:not-allowed}
.qty span{min-width:34px;text-align:center;font-weight:700}
.rm{background:transparent;border:0;color:var(--dim);cursor:pointer;text-decoration:underline;font-size:13px;align-self:end;justify-self:end}.rm:hover{color:var(--bad)}
.note{background:var(--card2);border-left:3px solid #f2b827;padding:10px 12px;font-size:14px;margin-bottom:14px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:60px 0}
form.co label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
form.co input:not([type=radio]),form.co textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:46px}
form.co input:focus,form.co textarea:focus{outline:0;border-color:var(--accent)}
form.co textarea{min-height:70px;resize:vertical}
form.co input[type=file]{padding:9px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h3{font:700 13px/1 var(--head);letter-spacing:.5px;text-transform:uppercase;margin:22px 0 4px;padding-left:10px;border-left:4px solid var(--accent)}
.acc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:10px;cursor:pointer;background:var(--card)}
.acc:has(input:checked){border-color:var(--accent);background:var(--card2)}
.acc input{margin-top:4px;accent-color:var(--accent)}
.acc div{font-size:14px;line-height:1.45;min-width:0;word-break:break-word}.acc b{display:block}.acc small{color:var(--dim)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.sum .g{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:1px}
.done{text-align:center;padding:30px 0}
.done h3{font:700 20px/1.3 var(--head);margin:14px 0 8px}.done p{color:var(--mute);margin-bottom:6px}
.tick{width:64px;height:64px;border-radius:50%;background:rgba(74,222,128,.15);color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:32px}
.stack{display:grid;gap:10px;margin-top:22px}

@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
  .hd-in{grid-template-columns:1fr auto;gap:10px}.search{grid-column:1/-1;order:3;max-width:none}
  .bar{grid-template-columns:1fr 1fr}.chips{grid-column:1/-1}.bar select{min-width:0;width:100%}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){.grid{gap:12px}.body{padding:14px 12px 16px}.name{font-size:15px}.price{font-size:15px}.btn{font-size:11px;padding:12px 8px}.acct{padding:10px 11px;font-size:11px}.r2{grid-template-columns:1fr}.logo img{height:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hd" id="hd">
  <div class="hd-in">
    <a class="logo" href="/" aria-label="CCTV PITS home"><img src="/assets/images/logo.png" alt="CCTV PITS" width="120" height="36"></a>
    <form class="search" role="search" id="sf" onsubmit="return false">
      <label class="sr" for="q">Search products</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search cameras, DVRs, brands..." autocomplete="off">
    </form>
    <div class="acts">
      <a class="acct" id="acct" href="/login.html?next=%2F">Login</a>
      <button class="cartbtn" id="cartbtn" type="button" aria-label="Open cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a1.6 1.6 0 0 0 1.6 1.2h8.2a1.6 1.6 0 0 0 1.6-1.2L21 7H6"/></svg>
        <span class="sr">Cart,</span><b id="cc">0</b>
      </button>
    </div>
  </div>
</header>

<div class="bar" id="bar">
  <div class="chips" id="chips" aria-label="Categories"></div>
  <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
  <select id="sort" aria-label="Sort by"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A to Z</option></select>
</div>
<p class="count" id="count" aria-live="polite">Loading products...</p>

<main id="main">
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="more" id="more" hidden><button type="button">Show more products</button></div>
  <noscript><p class="msg">Please turn on JavaScript to shop, or message us on WhatsApp.</p></noscript>
</main>

<footer class="ft" id="ft">&copy; CCTV PITS &middot; Orders are confirmed after payment is verified &middot; <a id="walink" href="https://wa.me/923053871991" target="_blank" rel="noopener">WhatsApp +92 305 3871991</a></footer>

<div id="toast" role="status" aria-live="polite"></div>
<div id="ov"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" aria-hidden="true">
  <div class="ph"><h2 id="ptitle">Your cart</h2><button class="x" id="pclose" type="button" aria-label="Close">&times;</button></div>
  <div id="pbody"></div>
  <div class="pf" id="pfoot" hidden></div>
</aside>

<script type="module">
import { loadProducts, hydrateImages, esc, money, waLink, WA } from "/products-data.js";
import { getCart, addToCart, setQty, clearCart, cartCount, cartTotal, shrink } from "/cart.js";

const $ = id => document.getElementById(id), PER = 24;
const FS = "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js", AU = "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
let all = [], byId = new Map(), shown = PER, ready = false, failed = false, cat = "";
const grid = $("grid"), more = $("more"), countEl = $("count"), q = $("q"), selB = $("brand"), selS = $("sort");

/* ---------------- helpers ---------------- */
const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => x.localeCompare(y));
let tt; const toast = t => { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 2200); };
const inCart = id => (getCart().find(x => x.id === id) || {}).qty || 0;

/* ---------------- firebase (loaded only when needed) ---------------- */
let fbp = null, authP = null, user = null;
const fire = () => fbp || (fbp = Promise.all([import("/firebase-lite.js"), import(AU), import(FS)]).then(([l, a, f]) => ({ auth: l.auth, db: l.db, a, f })));
const drawAcct = k => { const a = $("acct"); a.textContent = k === "guest" ? "Login" : k === "admin" ? "Admin" : "My account"; a.href = k === "guest" ? "/login.html?next=%2F" : k === "admin" ? "/admin.html" : "/dashboard.html"; };
try { drawAcct(localStorage.getItem("acct-hint") || "guest"); } catch (e) {}
const authState = () => authP || (authP = fire().then(x => new Promise(res => {
  x.a.onAuthStateChanged(x.auth, async u => {
    user = u; let k = "guest";
    if (u) { k = "user"; try { if ((await x.f.getDoc(x.f.doc(x.db, "admins", u.uid))).exists()) k = "admin"; } catch (e) {} }
    try { localStorage.setItem("acct-hint", k); } catch (e) {}
    drawAcct(k); res(u);
  });
})));
(window.requestIdleCallback ? f => requestIdleCallback(f, { timeout: 3000 }) : f => setTimeout(f, 1500))(() => authState().catch(() => {}));

/* ---------------- product grid ---------------- */
const card = p => {
  const out = p.stock !== null && p.stock <= 0, low = p.stock !== null && p.stock > 0 && p.stock <= 5, off = p.comparePrice > p.price && p.price > 0 ? Math.round((1 - p.price / p.comparePrice) * 100) : 0;
  const action = p.price > 0 ? (out ? '<button class="btn" type="button" disabled>Out of stock</button>' : '<button class="btn" type="button" data-add="' + esc(p.id) + '">Add to cart</button>')
    : '<a class="btn ghost" href="' + waLink(p) + '" target="_blank" rel="noopener">Ask price on WhatsApp</a>';
  return '<article class="card"><div class="media"><div class="prd-img" data-id="' + esc(p.id) + '"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8h13v8H3z"/><path d="m16 11 5-3v8l-5-3"/></svg></div>' +
    (p.isNew ? '<span class="badge b-new">New</span>' : "") + (off > 0 ? '<span class="badge b-off">-' + off + '%</span>' : "") + '</div>' +
    '<div class="body">' + (p.brand ? '<span class="brand">' + esc(p.brand) + '</span>' : "") + '<h3 class="name">' + esc(p.name) + '</h3>' + (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : "") +
    '<div class="price">' + (p.price > 0 ? money(p.price) + (off > 0 ? '<s>' + money(p.comparePrice) + '</s>' : "") : '<span style="font-size:15px">Call for price</span>') + '</div>' +
    '<div class="stock ' + (out ? "out" : low ? "low" : "in") + '">' + (out ? "Out of stock" : low ? "Only " + p.stock + " left" : "In stock") + '</div>' + action + '</div></article>';
};
function view() {
  const term = q.value.trim().toLowerCase(), b = selB.value, s = selS.value;
  const v = all.filter(p => (!b || p.brand === b) && (!cat || p.category === cat) && (!term || (p.name + " " + p.brand + " " + p.category + " " + p.description).toLowerCase().includes(term)));
  if (s === "low") v.sort((x, y) => (x.price || 1e12) - (y.price || 1e12)); else if (s === "high") v.sort((x, y) => y.price - x.price); else if (s === "name") v.sort((x, y) => x.name.localeCompare(y.name));
  return v;
}
function draw(reset) {
  if (!ready) return;
  if (reset) shown = PER;
  const v = view();
  countEl.textContent = v.length + " product" + (v.length === 1 ? "" : "s");
  grid.innerHTML = v.length ? v.slice(0, shown).map(card).join("") : '<p class="msg">No products match your search. Try a different word or clear the filters.</p>';
  more.hidden = v.length <= shown; hydrateImages(grid, byId);
}
function drawChips() {
  const cats = uniq(all.filter(p => !selB.value || p.brand === selB.value).map(p => p.category));
  if (cat && !cats.includes(cat)) cat = "";
  $("chips").innerHTML = ["", ...cats].map(c => '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + (c ? esc(c) : "All") + '</button>').join("");
}
function syncUrl() {
  const p = new URLSearchParams(); if (q.value.trim()) p.set("q", q.value.trim()); if (selB.value) p.set("brand", selB.value); if (cat) p.set("category", cat);
  try { history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "")); } catch (e) {}
}
(async () => {
  const list = await loadProducts();
  if (list === null) { failed = true; grid.innerHTML = '<p class="msg">We could not load the products. Please refresh, or message us on WhatsApp.</p>'; countEl.textContent = ""; return; }
  if (!list.length) { grid.innerHTML = '<p class="msg">Products are coming soon. Message us on WhatsApp for prices and availability.</p>'; countEl.textContent = ""; return; }
  all = list; all.forEach(p => byId.set(p.id, p)); ready = true;
  const u = new URLSearchParams(location.search);
  q.value = u.get("q") || ""; cat = u.get("category") || "";
  const brands = uniq(all.map(p => p.brand)); selB.innerHTML = '<option value="">All brands</option>' + brands.map(b => '<option>' + esc(b) + '</option>').join(""); selB.value = brands.includes(u.get("brand")) ? u.get("brand") : "";
  drawChips(); draw(true);
})();
let st; q.addEventListener("input", () => { clearTimeout(st); st = setTimeout(() => { syncUrl(); draw(true); }, 200); });
selB.addEventListener("change", () => { drawChips(); syncUrl(); draw(true); });
selS.addEventListener("change", () => draw(true));
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; cat = b.dataset.cat; drawChips(); syncUrl(); draw(true); });
more.querySelector("button").addEventListener("click", () => { shown += PER; draw(false); });
grid.addEventListener("click", e => {
  const b = e.target.closest("[data-add]"); if (!b) return;
  const p = byId.get(b.dataset.add); if (!p) return;
  if (p.stock !== null && inCart(p.id) >= p.stock) return toast("Only " + p.stock + " in stock");
  addToCart(p); toast(p.name + " added to cart");
});

/* ---------------- cart badge ---------------- */
const badge = () => { const n = cartCount(), b = $("cc"); b.textContent = n; b.classList.remove("bump"); void b.offsetWidth; if (n) b.classList.add("bump"); };
addEventListener("cartchange", () => { badge(); if (open && mode === "cart") renderCart(); });
addEventListener("storage", () => { badge(); if (open && mode === "cart") renderCart(); });
badge();

/* ---------------- side panel ---------------- */
let open = false, mode = "cart", opener = null, notes = [];
const panel = $("panel"), pbody = $("pbody"), pfoot = $("pfoot");
function openPanel(m) {
  opener = document.activeElement; open = true;
  $("ov").classList.add("on"); panel.classList.add("on"); panel.setAttribute("aria-hidden", "false");
  ["hd", "bar", "count", "main", "ft"].forEach(id => { const e = $(id); if (e) e.inert = true; });
  document.body.style.overflow = "hidden";
  m === "checkout" ? startCheckout() : renderCart(); $("pclose").focus();
}
function closePanel() {
  open = false; $("ov").classList.remove("on"); panel.classList.remove("on"); panel.setAttribute("aria-hidden", "true");
  ["hd", "bar", "count", "main", "ft"].forEach(id => { const e = $(id); if (e) e.inert = false; });
  document.body.style.overflow = ""; if (opener && opener.focus) opener.focus();
}
$("cartbtn").onclick = () => openPanel("cart"); $("pclose").onclick = closePanel; $("ov").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape" && open) closePanel(); });
const setTitle = t => { $("ptitle").textContent = t; };
const footer = html => { pfoot.hidden = !html; pfoot.innerHTML = html || ""; };

/* ---- cart view ---- */
function renderCart() {
  mode = "cart"; setTitle("Your cart");
  const lines = getCart();
  if (!lines.length) { pbody.innerHTML = '<div class="empty"><p>Your cart is empty.</p><div class="stack"><button class="btn" type="button" data-close>Continue shopping</button></div></div>'; return footer(""); }
  pbody.innerHTML = (notes.length ? '<div class="note">' + notes.map(esc).join("<br>") + '</div>' : "") + lines.map(l => {
    const p = byId.get(l.id), cap = p && p.stock !== null ? p.stock : Infinity;
    return '<div class="line" data-id="' + esc(l.id) + '"><div><div class="n">' + esc(l.name) + '</div><div class="u">' + money(l.price) + ' each</div>' +
      '<div class="qty"><button type="button" data-q="-1" aria-label="Decrease quantity">&minus;</button><span aria-live="polite">' + l.qty + '</span><button type="button" data-q="1" aria-label="Increase quantity"' + (l.qty >= cap ? " disabled" : "") + '>+</button></div></div>' +
      '<div class="t">' + money(l.price * l.qty) + '</div><button class="rm" type="button" data-rm>Remove</button></div>';
  }).join("");
  footer('<div class="tot"><span>Subtotal</span><b>' + money(cartTotal()) + '</b></div><button class="btn" type="button" data-checkout>Checkout</button>');
}
panel.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closePanel();
  if (e.target.closest("[data-checkout]")) return startCheckout();
  if (e.target.closest("[data-back]")) { notes = []; return renderCart(); }
  const ln = e.target.closest(".line"); if (!ln || mode !== "cart") return;
  const id = ln.dataset.id, cur = inCart(id);
  if (e.target.closest("[data-rm]")) return setQty(id, 0);
  const d = e.target.closest("[data-q]"); if (d) { notes = []; setQty(id, cur + Number(d.dataset.q)); }
});

/* ---- checkout ---- */
function reconcile() {
  const out = [], keep = [];
  getCart().forEach(l => {
    const p = byId.get(l.id);
    if (!p || !(p.price > 0)) return out.push(l.name + " is no longer available and was removed.");
    if (p.stock !== null && p.stock <= 0) return out.push(p.name + " is out of stock and was removed.");
    let n = l.qty; if (p.stock !== null && n > p.stock) { n = p.stock; out.push("Only " + p.stock + " of " + p.name + " left. Quantity reduced."); }
    if (l.price !== p.price) out.push("The price of " + p.name + " is now " + money(p.price) + ".");
    keep.push([p, n]);
  });
  if (out.length) { clearCart(); keep.forEach(([p, n]) => { addToCart(p); setQty(p.id, n); }); }
  return out;
}
async function startCheckout() {
  if (!getCart().length) return renderCart();
  mode = "wait"; setTitle("Checkout"); footer(""); pbody.innerHTML = '<p class="empty">Checking your cart...</p>';
  if (failed || !ready) { pbody.innerHTML = '<p class="empty">We could not verify current prices. Please refresh the page and try again.</p>'; return; }
  notes = reconcile();
  if (notes.length) return renderCart();            // show what changed first; the customer presses Checkout again
  let u = null; try { u = await authState(); } catch (e) {}
  if (!u) {
    mode = "login"; pbody.innerHTML = '<div class="empty"><p>Log in or create an account to place your order. Your cart is saved.</p><div class="stack"><a class="btn" href="/login.html?next=%2F">Log in</a><a class="btn sec" href="/register.html?next=%2F">Create account</a><button class="btn sec" type="button" data-back>Back to cart</button></div></div>'; return;
  }
  let accounts = [], prof = {};
  try {
    const x = await fire();
    const [as, ps] = await Promise.all([x.f.getDocs(x.f.collection(x.db, "paymentAccounts")), x.f.getDoc(x.f.doc(x.db, "users", u.uid))]);
    accounts = as.docs.map(d => ({ id: d.id, ...d.data() })).filter(a => a.active !== false); prof = ps.exists() ? ps.data() : {};
  } catch (e) { pbody.innerHTML = '<p class="empty">Could not load payment details. Check your connection and try again.</p>'; return; }
  renderForm(u, accounts, prof);
}
function renderForm(u, accounts, prof) {
  mode = "form"; setTitle("Checkout");
  const lines = getCart();
  pbody.innerHTML = '<div class="sum">' + lines.map(l => '<div><span>' + esc(l.qty) + ' &times; ' + esc(l.name) + '</span><span>' + money(l.qty * l.price) + '</span></div>').join("") + '<div class="g"><span>Total</span><span>' + money(cartTotal()) + '</span></div></div>' +
    '<form class="co" id="cof" novalidate>' +
    '<h3 class="h3">Delivery details</h3>' +
    '<label for="cn">Full name</label><input id="cn" autocomplete="name" required maxlength="80" value="' + esc(prof.name || u.displayName || "") + '">' +
    '<label for="cp">WhatsApp / phone number</label><input id="cp" type="tel" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="03xx xxxxxxx" value="' + esc(prof.phone || "") + '">' +
    '<label for="ca">Address</label><textarea id="ca" autocomplete="street-address" required maxlength="250"></textarea>' +
    '<div class="r2"><div><label for="cc2">City</label><input id="cc2" autocomplete="address-level2" required maxlength="60"></div><div><label for="cnote">Note (optional)</label><input id="cnote" maxlength="200"></div></div>' +
    '<h3 class="h3">Payment</h3>' +
    (accounts.length ? '<p style="color:var(--mute);font-size:14px;margin-top:8px">Send the exact total to one account below, then enter the transaction ID.</p>' +
      accounts.map((a, i) => '<label class="acc"><input type="radio" name="pay" value="' + esc(a.id) + '"' + (i ? "" : " checked") + '><div><b>' + esc(a.bankName) + '</b>' + esc(a.accountTitle) + '<br>' + esc(a.accountNumber) + (a.note ? '<br><small>' + esc(a.note) + '</small>' : "") + '</div></label>').join("") +
      '<label for="ct">Transaction ID</label><input id="ct" required maxlength="60" autocomplete="off">' +
      '<label for="cs">Payment screenshot (recommended)</label><input id="cs" type="file" accept="image/*">'
      : '<p class="note" style="margin-top:10px">Payment accounts are not available right now. Please message us on WhatsApp to complete your order.</p>') +
    '<div class="err" id="cerr" role="alert"></div></form>';
  footer('<div class="tot"><span>Total</span><b>' + money(cartTotal()) + '</b></div><button class="btn" type="button" id="place"' + (accounts.length ? "" : " disabled") + '>Place order</button><button class="btn sec" type="button" data-back style="margin-top:8px">Back to cart</button>');
  panel._ctx = { u, accounts }; pbody.scrollTop = 0;
}
panel.addEventListener("click", async e => {
  if (!e.target.closest("#place") || mode !== "form") return;
  const btn = $("place"), err = t => { $("cerr").textContent = t; };
  const { u, accounts } = panel._ctx, name = $("cn").value.trim(), phone = $("cp").value.trim(), addr = $("ca").value.trim(), city = $("cc2").value.trim(), trx = $("ct").value.trim();
  const acc = accounts.find(a => a.id === (document.querySelector('input[name="pay"]:checked') || {}).value);
  err("");
  if (!name || !addr || !city) return err("Fill in your name, address and city.");
  if (phone.replace(/\D/g, "").length < 10) return err("Enter a valid phone number.");
  if (!acc) return err("Choose the account you paid to.");
  if (!trx) return err("Enter the transaction ID of your payment.");
  const lines = getCart(); if (!lines.length) return renderCart();
  if (reconcile().length) { notes = ["Your cart changed while you were checking out. Please review it."]; return renderCart(); }
  btn.disabled = true; btn.textContent = "Placing order...";
  try {
    const f = $("cs").files[0], shot = f ? await shrink(f, 900, 0.7) : "", x = await fire(), ls = getCart();
    const ref = await x.f.addDoc(x.f.collection(x.db, "orders"), {
      userId: u.uid, email: u.email || "", customer: { name, phone, address: addr, city, note: $("cnote").value.trim() },
      items: ls.map(l => ({ id: l.id, name: l.name, price: l.price, qty: l.qty })), total: cartTotal(),
      payment: { bankName: acc.bankName || "", accountTitle: acc.accountTitle || "", accountNumber: acc.accountNumber || "" },
      trxId: trx, screenshot: shot, installation: false, status: "pending", createdAt: x.f.serverTimestamp()
    });
    const total = cartTotal(); clearCart(); notes = []; done(ref.id, total);
  } catch (ex) {
    console.error(ex); btn.disabled = false; btn.textContent = "Place order";
    err(ex && ex.code === "permission-denied" ? "Your session expired. Log in again and retry." : "Could not place your order. Check your connection and try again.");
  }
});
function done(id, total) {
  mode = "done"; setTitle("Order placed"); const no = id.slice(0, 6).toUpperCase();
  pbody.innerHTML = '<div class="done"><span class="tick" aria-hidden="true">&#10003;</span><h3>Thank you!</h3><p>Your order <b>#' + no + '</b> for ' + money(total) + ' is received.</p><p>We will confirm it once your payment is verified. You can track it in your account.</p>' +
    '<div class="stack"><a class="btn" href="https://wa.me/' + WA + '?text=' + encodeURIComponent("Hello CCTV PITS, I placed order #" + no + ".") + '" target="_blank" rel="noopener">Message us on WhatsApp</a><a class="btn sec" href="/dashboard.html">View my orders</a><button class="btn sec" type="button" data-close>Continue shopping</button></div></div>';
  footer("");
}
</script>
</body>
</html>
