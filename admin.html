<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | CCTV PITS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.png" alt="" onerror="this.style.display='none'">CCTV PITS <span class="pill admin">Admin</span></a>
  <nav><a href="index.html">View store</a><a href="#" id="out">Log out</a></nav>
</header>
<main class="wrap" id="main" hidden>
  <h1>Admin dashboard</h1>
  <p class="sub">Add products and see who registered.</p>

  <div class="box"><h2>Add product</h2>
    <form id="pf" class="wide">
      <div class="row">
        <div><label for="pname">Product name</label><input id="pname" required></div>
        <div><label for="pprice">Price (Rs.)</label><input id="pprice" type="number" min="0" step="1" required></div>
      </div>
      <div class="row">
        <div><label for="pcat">Category</label>
          <select id="pcat"><option>Wi-Fi cameras</option><option>DVR and NVR</option><option>Hard drives</option><option>Accessories</option></select></div>
        <div><label for="pimg">Photo</label><input id="pimg" type="file" accept="image/*"></div>
      </div>
      <img id="preview" alt="">
      <label for="pdesc">Short description</label>
      <textarea id="pdesc" maxlength="200"></textarea>
      <button class="primary" type="submit" style="max-width:220px">Add product</button>
      <div id="pmsg" class="msg" role="alert"></div>
    </form>
  </div>

  <div class="box"><h2>Products (<span id="pcount">0</span>)</h2>
    <div class="scroll"><table class="tbl"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th></th></tr></thead><tbody id="plist"></tbody></table></div>
  </div>

  <div class="box"><h2>Registered users (<span id="ucount">0</span>)</h2>
    <div class="scroll"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead><tbody id="ulist"></tbody></table></div>
  </div>
</main>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, getDoc, collection, addDoc, getDocs, deleteDoc, updateDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = (t, c) => { $("pmsg").textContent = t; $("pmsg").className = "msg " + c; };
$("out").onclick = e => { e.preventDefault(); signOut(auth); };

let imageData = "";

// Shrinks the photo in the browser so it fits in Firestore (no Storage plan needed)
function shrink(file, max = 700) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = rej; img.src = url;
  });
}
$("pimg").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) { imageData = ""; $("preview").style.display = "none"; return; }
  try {
    imageData = await shrink(f);
    $("preview").src = imageData; $("preview").style.display = "block";
  } catch (err) { show("That file is not a valid image.", "err"); }
});

async function loadProducts() {
  const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
  $("pcount").textContent = snap.size;
  $("plist").innerHTML = snap.docs.map(d => { const p = d.data(); return `
    <tr data-id="${d.id}">
      <td>${p.image ? `<img src="${esc(p.image)}" alt="">` : ""}</td>
      <td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>Rs. ${Number(p.price).toLocaleString()}</td>
      <td style="white-space:nowrap"><button class="sm" data-act="price">Edit price</button> <button class="sm del" data-act="del">Delete</button></td>
    </tr>`; }).join("") || '<tr><td colspan="5">No products yet. Add your first one above.</td></tr>';
}

async function loadUsers() {
  const snap = await getDocs(collection(db, "users"));
  $("ucount").textContent = snap.size;
  $("ulist").innerHTML = snap.docs.map(d => { const u = d.data(); return `
    <tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td>
    <td>${u.createdAt ? u.createdAt.toDate().toLocaleDateString() : "-"}</td></tr>`; }).join("");
}

$("plist").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.closest("tr").dataset.id, ref = doc(db, "products", id);
  try {
    if (b.dataset.act === "del") {
      if (!confirm("Delete this product?")) return;
      await deleteDoc(ref);
    } else {
      const v = prompt("New price (Rs.)");
      if (v === null || isNaN(Number(v)) || v.trim() === "") return;
      await updateDoc(ref, { price: Number(v) });
    }
    loadProducts();
  } catch (err) { alert("Action failed. Check your Firestore rules."); }
});

$("pf").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button.primary");
  btn.disabled = true;
  try {
    await addDoc(collection(db, "products"), {
      name: $("pname").value.trim(),
      price: Number($("pprice").value),
      category: $("pcat").value,
      description: $("pdesc").value.trim(),
      image: imageData,
      createdAt: serverTimestamp(),
      createdBy: auth.currentUser.uid
    });
    e.target.reset(); imageData = ""; $("preview").style.display = "none";
    show("Product added. It is now live on the store.", "ok");
    loadProducts();
  } catch (err) {
    show("Could not add product. Make sure the photo is small and your admin access is set up.", "err");
  }
  btn.disabled = false;
});

onAuthStateChanged(auth, async u => {
  if (!u) return location.replace("login.html");
  let admin = false;
  try { admin = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!admin) return location.replace("dashboard.html");
  $("main").hidden = false;
  loadProducts(); loadUsers();
});
</script>
</body>
</html>
